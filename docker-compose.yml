services:
  api:
    build: ./server
    container_name: terminalfor-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      # Если t.me/MOEX/RSS не отдаются напрямую с сервера — раскомментируйте и
      # укажите свой HTTP(S)-прокси, все исходящие запросы бэкенда пойдут через него.
      # HTTPS_PROXY: "http://user:pass@proxy-host:3128"
      PORT: "4000"
      # Токен T-Invest API (Т-Инвестиции → Настройки → API, права "Только
      # просмотр" достаточно) — без задержки MOEX ISS в 15 минут для
      # анонимного доступа. Без токена приложение работает как раньше, на ISS.
      TINVEST_TOKEN: "${TINVEST_TOKEN:-}"
      # Сертификат T-Invest API подписан российским Trusted CA (Минцифры) —
      # его нет в стандартном доверенном наборе Node/Alpine, без этого TLS
      # к invest-public-api.tinkoff.ru падает с "self-signed certificate in chain".
      NODE_EXTRA_CA_CERTS: "/app/certs/russian_trusted_ca_bundle.pem"

  web:
    build: .
    container_name: terminalfor
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # слева — порт на хосте, который сейчас смотрит наружу (nginx/прокси/domain).
      - "8080:80"
